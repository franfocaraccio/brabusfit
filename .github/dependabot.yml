version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Expo, React y React Native se suben juntos al cambiar de SDK con
    # `npx expo install --fix` (ver AGENTS.md → "Versión de Expo"): una sola
    # copia de React para web y mobile. Dependabot no los toca.
    ignore:
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: eslint-config-expo
      # Fijado en todos lados a la vez (ver AGENTS.md).
      - dependency-name: supabase
      # ESLint 10 todavía no es compatible con eslint-plugin-react (lo trae
      # eslint-config-next): se sube cuando Next lo soporte.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Los tipos de Node siguen a la versión de Node con la que corre cada app.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
